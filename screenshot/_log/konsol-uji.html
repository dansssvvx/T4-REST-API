<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Konsol Uji REST API - Koleksi Tanaman Hias</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#11161d; --panel-2:#0e1319; --line:#223041;
    --text:#e6edf3; --muted:#8b98a9; --get:#22c55e; --del:#ef4444;
    --s200:#22c55e; --s204:#3b82f6; --s404:#ef4444;
    --json-key:#7dd3fc; --json-str:#a5e3a0; --json-num:#f0b978; --json-bool:#c792ea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:13px/1.5 "Segoe UI",system-ui,sans-serif;padding:28px 36px 40px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--get);box-shadow:0 0 0 4px #22c55e22}
  .title{font-size:15px;font-weight:600;letter-spacing:.2px}
  .subt{color:var(--muted);font-size:12.5px}
  .bar{display:flex;gap:10px;align-items:stretch;background:var(--panel);
       border:1px solid var(--line);border-radius:10px;padding:10px}
  .method{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:7px;
          font:600 13px/1 "Consolas",monospace;letter-spacing:.5px;background:#0f2a1a;color:var(--get);
          border:1px solid #1d4d31;min-width:120px;justify-content:center}
  .method.delete{background:#2a1315;color:var(--del);border-color:#5a2226}
  .url{flex:1;display:flex;align-items:center;padding:0 14px;background:var(--panel-2);
       border:1px solid var(--line);border-radius:7px;font:13px/1 "Consolas",monospace;color:#dbe6f2}
  .send{display:flex;align-items:center;padding:0 22px;border-radius:7px;background:#1f6feb;
        color:#fff;font-weight:600;font-size:13px}
  .meta{display:flex;align-items:center;gap:18px;margin:18px 2px 10px}
  .status{font:600 13px/1 "Consolas",monospace;padding:7px 12px;border-radius:6px}
  .status.s200{background:#0f2a1a;color:var(--s200);border:1px solid #1d4d31}
  .status.s204{background:#0f1e33;color:#60a5fa;border:1px solid #1e3a5f}
  .status.s404{background:#2a1315;color:var(--s404);border:1px solid #5a2226}
  .kv{color:var(--muted);font-size:12.5px}
  .kv b{color:#cbd5e1;font-weight:500}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tabs{display:flex;gap:6px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
  .tab{padding:7px 14px;border-radius:7px 7px 0 0;color:var(--muted);font-size:12.5px}
  .tab.on{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--panel-2);margin-bottom:-1px}
  pre{margin:0;padding:16px 18px;font:12.5px/1.5 "Consolas","Courier New",monospace;
      white-space:pre-wrap;word-break:break-word;color:#d5e0ec}
  .k{color:var(--json-key)} .s{color:var(--json-str)} .n{color:var(--json-num)}
  .b{color:var(--json-bool)} .nul{color:var(--muted)}
  .term{background:#0a0e13;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .term pre{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .p{color:#4ade80} .c{color:#93c5fd} .m{color:#e6edf3}
  .hint{color:var(--muted);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const newLine = "\n";
const BASE = "http://localhost:3000";

const CASES = {
  server: {
    caption: "Terminal - npm run dev",
    terminal: [
      'PS D:\\College\\S7\\Pemrograman  Web Lanjut\\Tugas\\Tugas 4 REST API> npm run dev',
      '',
      '> t4-rest-api@1.0.0 dev',
      '> node --watch index.js',
      '',
      'Server berjalan di http://localhost:3000'
    ]
  },
  "get-daftar":         { method: "GET",    path: "/tanaman" },
  "get-detail-200":     { method: "GET",    path: "/tanaman/3" },
  "get-detail-404":     { method: "GET",    path: "/tanaman/999" },
  "delete-204":         { method: "DELETE", path: "/tanaman/5" },
  "get-daftar-setelah": { method: "GET",    path: "/tanaman" }
};

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function highlight(json){
  return esc(json)
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="s">$1</span>')
    .replace(/:\s*(-?\d+(?:\.\d+)?)/g, ': <span class="n">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span class="b">$1</span>')
    .replace(/:\s*(null)/g, ': <span class="nul">$1</span>');
}

function header(method, path){
  return '<div class="top">'
    + '<span class="dot"></span>'
    + '<div><div class="title">Konsol Uji REST API &mdash; Koleksi Tanaman Hias</div>'
    + '<div class="subt">http://localhost:3000</div></div></div>'
    + '<div class="bar">'
    + '<div class="method ' + (method === "DELETE" ? "delete" : "") + '">' + method + '</div>'
    + '<div class="url">' + esc(BASE + path) + '</div>'
    + '<div class="send">Send</div></div>';
}

async function main(){
  const name = new URLSearchParams(location.search).get("case") || "get-daftar";
  const spec = CASES[name];
  const app = document.getElementById("app");

  if (spec.terminal){
    const body = spec.terminal.map(function(line, i){
      if (i === 0) return '<span class="p">PS</span> ' + esc(line.slice(3));
      if (line.indexOf(">") === 0) return '<span class="c">' + esc(line) + '</span>';
      if (line.indexOf("Server berjalan") === 0) return '<span class="p">' + esc(line) + '</span>';
      return esc(line);
    }).join(newLine);
    app.innerHTML = '<div class="top"><span class="dot"></span><div>'
      + '<div class="title">Terminal &mdash; menjalankan server</div>'
      + '<div class="subt">npm run dev &middot; node --watch index.js</div></div></div>'
      + '<div class="term"><pre>' + body + '</pre></div>'
      + '<div class="hint">Isi terminal di atas disalin apa adanya dari screenshot/_log/server.log</div>';
    return;
  }

  app.innerHTML = header(spec.method, spec.path)
    + '<div class="meta"><span class="status">mengirim ' + spec.method + ' ...</span></div>';

  const t0 = performance.now();
  let res, text = "", json = null;
  try {
    res = await fetch(BASE + spec.path, { method: spec.method });
    text = await res.text();
  } catch (e) {
    app.innerHTML = header(spec.method, spec.path)
      + '<div class="meta"><span class="status s404">GAGAL</span> <span class="kv">' + esc(String(e)) + '</span></div>';
    return;
  }
  const ms = Math.round(performance.now() - t0);
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }

  const cls = "s" + res.status;
  const size = new Blob([text]).size + " B";
  let bodyHtml;
  if (json !== null) {
    bodyHtml = '<pre>' + highlight(JSON.stringify(json, null, 2)) + '</pre>';
  } else {
    bodyHtml = '<pre>' + (text ? esc(text) : '<span class="nul">(body kosong &mdash; 204 No Content)</span>') + '</pre>';
  }

  app.innerHTML = header(spec.method, spec.path)
    + '<div class="meta">'
    + '<span class="status ' + cls + '">' + res.status + ' ' + esc(res.statusText) + '</span>'
    + '<span class="kv"><b>' + size + '</b> Body</span>'
    + '<span class="kv"><b>' + ms + ' ms</b> Waktu</span>'
    + '<span class="kv">Content-Type: <b>' + esc(res.headers.get("content-type") || "-") + '</b></span>'
    + '</div>'
    + '<div class="panel"><div class="tabs">'
    + '<div class="tab on">Body</div><div class="tab">Headers</div><div class="tab">Cookies</div>'
    + '</div>' + bodyHtml + '</div>'
    + '<div class="hint">Respons di atas berasal dari permintaan HTTP sungguhan ke server Express yang sedang berjalan.</div>';
}

main();
</script>
</body>
</html>
